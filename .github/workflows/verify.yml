name: Verify Reed

on:
  push:
  pull_request:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Install the Electron runtime for the startup check
        run: node node_modules/electron/install.js
      - run: npm run smoke
      - name: Audit dependencies (retry on transient registry timeouts)
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm audit --audit-level=high
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "npm audit failed on attempt $attempt/$maxAttempts. Retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }
          }
          exit $LASTEXITCODE

  dependency-update-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report dependencies with newer releases
        run: npm outdated
