name: Verify Reed

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reed-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Install the Electron runtime for the startup check
        run: node node_modules/electron/install.js
      - run: npm run smoke
      - name: Build the unsigned Windows installer
        run: npm run package:win
      - name: Launch the packaged application
        run: npm run package:smoke
      - name: Install, launch, and uninstall the packaged release
        run: npm run installer:smoke
      - name: Audit dependencies (retry on transient registry timeouts)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm audit --audit-level=high --fetch-timeout=120000 --fetch-retries=1
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "npm audit failed on attempt $attempt/$maxAttempts. Retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }
          }
          exit $LASTEXITCODE

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes against GitHub's advisory database
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  dependency-update-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report dependencies with newer releases
        run: npm outdated
