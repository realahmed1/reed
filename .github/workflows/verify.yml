name: Verify Reed

on:
  push:
  pull_request:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
