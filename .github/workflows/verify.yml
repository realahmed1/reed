name: Verify Reed

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reed-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Install the Electron runtime for the startup check
        run: node node_modules/electron/install.js
      - run: npm run smoke
      - name: Audit dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm audit --audit-level=high --fetch-timeout=120000 --fetch-retries=1
          if ($LASTEXITCODE -ne 0) {
            Write-Output "The first audit attempt failed; retrying once."
            npm audit --audit-level=high --fetch-timeout=120000 --fetch-retries=1
          }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes against GitHub's advisory database
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  dependency-update-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report dependencies with newer releases
        run: npm outdated
