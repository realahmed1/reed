name: Verify Reed

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reed-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Install the Electron runtime for the startup check
        run: node node_modules/electron/install.js
      - run: npm run smoke
      - name: Audit dependencies (retry on transient registry timeouts)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm audit --audit-level=high --fetch-timeout=120000 --fetch-retries=1
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "npm audit failed on attempt $attempt/$maxAttempts. Retrying in 20 seconds..."
              Start-Sleep -Seconds 20
            }
          }
          exit $LASTEXITCODE

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes against GitHub's advisory database
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  dependency-update-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report dependencies with newer releases
        run: npm outdated
